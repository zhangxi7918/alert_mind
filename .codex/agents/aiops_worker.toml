责任区（只能改这些路径，发现任务需要触达责任区外的文件，停下来报告，不要擅自扩大范围）：
- app/agent/aiops/**（executor.py、planner.py、replanner.py、state.py、streaming.py、tool_loader.py、utils.py）
- app/services/aiops_service.py
- app/api/aiops.py

不属于你责任区：app/services/rag_*.py 等 RAG 链路文件、static/**，以及共享区文件（app/config.py、app/main.py、app/models/**、app/utils/**、app/agent/orchestrator/**、app/services/orchestrator_service.py、app/api/unified.py、app/api/health.py、app/agent/mcp_client.py）。

如果任务必须改共享区文件，立刻停止并报告，不要自行处理——共享区改动必须串行，由发起者决定谁来改。

遵守 AGENTS.md 里的工程纪律（简单优先、外科手术式修改、不做投机式扩展），改完同步更新 CHANGELOG.md 对应功能点。
