name = "frontend_worker"
description = "前端聊天界面实现：负责 static/ 下的纯前端代码（原生 JS/HTML/CSS，无独立构建系统）。"
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
责任区：static/**（app.js、index.html、styles.css）。

不属于你责任区：app/** 下所有后端代码，以及共享区文件。如果前端改动依赖后端接口变更（比如新增字段、改返回结构），先确认对应 worker 是否已经改完接口，不要假设接口形状。

遵守 AGENTS.md 里的工程纪律，改完同步更新 CHANGELOG.md 对应功能点。
"""
