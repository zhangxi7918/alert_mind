services:
  prometheus:
    image: prom/prometheus:latest
    container_name: alert_mind_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: alert_mind_node_exporter
    ports:
      - "9100:9100"
    # macOS 下无法直接挂载 /proc /sys，使用容器内默认路径即可
    restart: unless-stopped

  monitor-server:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: alert-mind-app:latest
    container_name: alert_mind_monitor_server
    environment:
      PROMETHEUS_BASE_URL: http://prometheus:9090
    command: ["python", "mcp_servers/monitor_server.py"]
    ports:
      - "8004:8004"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: alert_mind_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  prometheus_data:
  redis_data:
